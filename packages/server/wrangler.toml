# The Majority Map API: a Cloudflare Worker with one D1 database. Deploy with `pnpm --filter @majority-map/server deploy`.
name = "majority-map-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# The game's web sites allowed to call the API; localhost is always allowed for development.
ALLOWED_ORIGINS = ""

[[d1_databases]]
binding = "DB"
database_name = "majority-map"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
