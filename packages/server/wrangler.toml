# The Majority Map API: a Cloudflare Worker with one D1 database. Deploy with `pnpm --filter @majority-map/server deploy`.
name = "majority-map-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# The game's web sites allowed to call the API, comma separated; localhost is always allowed for development. "*" for
# now, while the game is played from preview pages whose address isn't fixed; list the real hosts at the public beta.
ALLOWED_ORIGINS = "*"
# The game's web address: notification links open it, and push services see it as the sender.
SITE_URL = "https://majority-map.muhammademadk.workers.dev"
# Push notifications: the public half of the game's VAPID key. The private half is a secret (wrangler secret put
# VAPID_PRIVATE_KEY).
VAPID_PUBLIC_KEY = "BFNCeNfxT4ntIgAhWsdPHnLp-2lOhNSeACvvcrRyiQagMurGzGGe0ZVRHDyzI8UCVg17a3bmxd3UwR7xiatwe_o"

[[d1_databases]]
binding = "DB"
database_name = "majority-map"
database_id = "c7b41557-19d4-4ddb-9ed6-6284d9cd295f"
migrations_dir = "migrations"

# One Durable Object per private match (src/match.ts), stored in SQLite as the free plan requires.
[[durable_objects.bindings]]
name = "MATCHES"
class_name = "MatchRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

# Matchmaking for quick matches: one Durable Object holding everyone searching (src/matchmaker.ts).
[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Matchmaker"]

# Tournaments are driven by a timer: open sign-up, start rounds, seat winners (src/tournaments-run.ts).
[triggers]
crons = ["*/15 * * * *"]
