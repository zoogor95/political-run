name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @majority-map/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "true"

  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Computer-vs-computer matches on each pack; fails if a strategy wins more than 60% of its duels.
      - run: pnpm balance --out "$RUNNER_TEMP/uk.md"
      # 4,000 Pakistan matches, the size of the committed report.
      - run: pnpm balance --pack pk --games 4000 --out "$RUNNER_TEMP/pk.md"
      - run: cat "$RUNNER_TEMP/uk.md" "$RUNNER_TEMP/pk.md" >> "$GITHUB_STEP_SUMMARY"
        if: always()
